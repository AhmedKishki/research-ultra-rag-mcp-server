# Default settings for research-ultra-rag-mcp.
#
# This file ships inside the package and holds every tunable this server reads.
# A layer above it names only what it changes; layers win per key, lowest first:
#
#   this file  <  ~/.config/research-ultra-rag-mcp/config.toml
#              <  <project>/.research-rag/config.toml
#              <  --config PATH
#              <  RESEARCH_ULTRARAG_* environment variables
#              <  --set key=value
#
# `research-ultra-rag-mcp --print-config` prints the merged result and names the
# layer that supplied each value. A key that is not declared here is refused in
# every layer, so a typo is an error rather than a silent default.
#
# A setting whose class is `identity` decides what a generation contains: its
# value is recorded in the generation (the retrieval-policy fingerprint for
# ranking, the chunk settings for chunking), and changing it means the next
# ingestion builds a new generation instead of mixing two. `AGENTS.md` records
# the constants that deliberately stay in code: schema and policy versions, and
# the names and paths that make up the project boundary.

[language]
# The languages the corpus is written in, as ISO 639-1 codes (en, de, fr, ...):
# one code, or several separated by commas for a corpus in more than one
# language, most-used-first. Every language named decides whether the embedding
# model below covers the text, and a mismatch is reported by `status` instead of
# being silently embedded. Only a language BM25 can tokenize is accepted, because
# the stopword list comes from it. (identity: part of the ranking policy.)
corpus = "en"
# Which language's stopword list BM25 filters with. Empty means the first
# language named above, because BM25 takes a single list and a corpus in several
# languages has to point it at one of them; set it to choose another.
# (identity: part of the ranking policy.)
bm25_stopwords = ""

[runtime]
# Require an installed vanilla runtime and already-cached models.
offline = false
# debug, info, warn, or error.
log_level = "warn"
# lean (what an agent receives) or full (the developer debugging payload).
tool_detail = "lean"
# ONNX Runtime threads for the embedding model; 0 leaves the choice to the runtime.
embedding_threads = 0
# Shared FastEmbed model cache; empty means this application's per-user cache.
model_cache_root = ""

[retrieval]
# Reciprocal-rank-fusion constant: higher flattens the rank curve. (identity)
rrf_k = 60
# Weight of each rank in the fusion. (identity)
bm25_weight = 1.25
dense_weight = 1.0
# Fewest and most fused candidates a search considers. (identity)
minimum_candidates = 20
maximum_candidates = 200
# A dense candidate below this cosine similarity is withheld, not ranked. (identity)
dense_minimum_cosine_similarity = 0.72
# Most candidates the cross-encoder reorders by score; the unranked tail of the
# fused order is appended after them, so a reference group stays reachable. (identity)
rerank_max_candidates = 50
# Depth of the reranked window as a multiple of the requested top_k, and the
# fewest candidates reordered whatever top_k asks for: the window is
# max(top_k * rerank_window_multiple, rerank_window_floor), capped by
# rerank_max_candidates and the fused candidate count. (identity)
rerank_window_multiple = 2
rerank_window_floor = 10
# Pseudo-relevance feedback: search once, mine terms from the top lexical
# results, search again with them. Off by default until measured. (identity)
prf = false
# How many leaders the terms are mined from, and how many terms are added.
prf_documents = 5
prf_terms = 8
# Withheld candidates quoted per gate reason in a search answer. (identity)
maximum_withheld_examples = 5

[chunking]
# Target chunk length in GPT-2 tokens, and the tokens neighbours share. (identity:
# both are recorded in the generation and decide chunk boundaries.)
size = 384
overlap = 64
# Extraction units sent to one chunker call. Throughput only: each unit keeps its
# own durable output file and its own redo boundary.
batch_units = 16

[ingestion]
# Soft time budget for one ingest call; exhausting it returns a checkpointed
# in_progress result rather than losing work.
work_budget_seconds = 45
# Chunks embedded per gateway call, and PDF pages extracted per call. Throughput only.
embedding_batch_size = 64
pdf_page_batch_size = 8

[dense]
# Embedding model for the dense half of retrieval. Every supported name is pinned to
# a revision in embeddings.py, which also declares its dimension, its token limit,
# the languages it covers, and any query/passage prefix it requires. (engine choice,
# recorded in every generation it builds.)
embedding_model = "BAAI/bge-small-en-v1.5"
# Dense index backend for new generations: auto, exact, or qdrant. (engine choice,
# recorded in every generation it builds.)
backend = "auto"
# CPU cross-encoder that reranks every search. Every supported name is pinned to a
# revision in rerankers.py. (engine choice, recorded in the answer and the manifest.)
reranker_model = "Xenova/ms-marco-MiniLM-L-6-v2"
# Sequences per embedding inference. Throughput only: a batch of 1 returns exactly
# the same floats as a batch of 64 (MEASUREMENTS.md).
embedding_inference_batch_size = 1
# Above this many chunks, `auto` selects the embedded ANN index instead of the exact
# scan. (engine choice, recorded in every generation it builds.)
exact_backend_chunk_limit = 200000
