[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-ultra-rag-mcp"
version = "0.6.0"
description = "A project-scoped research knowledge-base MCP server built on vanilla UltraRAG"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "ebooklib>=0.20,<1",
    "fastembed==0.8.0",
    "fastmcp==3.4.0",
    "filelock>=3.16,<5",
    "pydantic>=2.12,<3",
    "pymupdf>=1.26,<2",
    "qdrant-client==1.19.1",
    "typing-extensions>=4.12,<5",
    "ultra-rag-mcp-ui @ git+https://github.com/AhmedKishki/ultra-rag-mcp-ui.git@72d2959b033eb532b8c5c9890b2cc8c070b51abe",
    "vanilla-ultra-rag-mcp @ git+https://github.com/AhmedKishki/vanilla-ultra-rag-mcp-server.git@d080b0c2c1172f029024149aee15d295cd8e0d14",
]

[project.scripts]
research-ultra-rag-mcp = "research_ultra_rag_mcp.server:main"
research-ultra-rag-ui = "research_ultra_rag_mcp.ui:main"
research-ultra-rag-verify = "research_ultra_rag_mcp.verify:main"

[project.urls]
Repository = "https://github.com/AhmedKishki/research-ultra-rag-mcp-server"
Issues = "https://github.com/AhmedKishki/research-ultra-rag-mcp-server/issues"
"Upstream UltraRAG" = "https://github.com/OpenBMB/UltraRAG"
"UltraRAG Documentation" = "https://ultrarag.openbmb.cn/pages/en/getting_started/introduction"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.7.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: starts the real vanilla UltraRAG stdio gateway",
]
