[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-ultra-rag-mcp"
version = "0.22.0"
description = "A project-scoped research knowledge-base MCP server built on vanilla UltraRAG"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "ebooklib>=0.20,<1",
    "fastembed==0.8.0",
    "fastmcp==3.4.0",
    "filelock>=3.16,<5",
    "numpy>=1.26,<3",
    "platformdirs>=4.3,<5",
    "tokenizers>=0.20,<1",
    "pydantic>=2.12,<3",
    "pymupdf>=1.26,<2",
    "qdrant-client==1.19.1",
    "ui-ultra-rag-mcp @ git+https://github.com/AhmedKishki/ui-ultra-rag-mcp.git@881f6a473b6df33941717c840aae8f258fd38679",
    "vanilla-ultra-rag-mcp @ git+https://github.com/AhmedKishki/vanilla-ultra-rag-mcp-server.git@05ae4b155d38a294260a36017f6429ce73b1641b",
]

[project.scripts]
research-ultra-rag-mcp = "research_ultra_rag_mcp.server:main"
research-ultra-rag-ui = "research_ultra_rag_mcp.ui:main"
research-ultra-rag-verify = "research_ultra_rag_mcp.verify:main"

[project.urls]
Repository = "https://github.com/AhmedKishki/research-ultra-rag-mcp-server"
Issues = "https://github.com/AhmedKishki/research-ultra-rag-mcp-server/issues"
"Upstream UltraRAG" = "https://github.com/OpenBMB/UltraRAG"
"UltraRAG Documentation" = "https://ultrarag.openbmb.cn/pages/en/getting_started/introduction"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.7.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: starts the real vanilla UltraRAG stdio gateway",
]
